[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///./autonomous_agent.db

[post_write_hooks]

[logging]
default_handler = stream

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = stream

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = stream
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_stream]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
